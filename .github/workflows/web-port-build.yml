name: Web port frontend build
on:
  push:
    branches: ["hghubx-web"]
  workflow_dispatch:
concurrency:
  group: web-port-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Commit refreshed lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh pnpm lockfile"
            git push
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright-core install chromium --with-deps
      - run: node scripts/test-quickjs-worker.mjs
