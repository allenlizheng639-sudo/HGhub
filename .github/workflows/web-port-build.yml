name: Web port frontend build
on:
  push:
    branches: ["hghubx-web"]
  workflow_dispatch:
concurrency:
  group: web-port-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
